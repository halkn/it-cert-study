<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Snowflakeの3層アーキテクチャ</title>
  <desc id="desc">利用者の要求をCloud Servicesが認証、メタデータ管理、クエリ最適化によって調整し、独立した複数のVirtual Warehouseが共通のDatabase Storageを読み書きする関係を示す。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#34506b"/>
    </marker>
    <style>
      .title { font: 700 30px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #102a43; }
      .layer { font: 700 23px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #102a43; }
      .label { font: 600 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #243b53; }
      .body { font: 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334e68; }
      .note { font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #486581; }
      .line { stroke: #34506b; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .data-line { marker-start: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="720" rx="24" fill="#f7fafc"/>
  <text x="600" y="48" text-anchor="middle" class="title">Snowflakeの3層アーキテクチャ</text>

  <rect x="455" y="72" width="290" height="58" rx="29" fill="#ffffff" stroke="#627d98" stroke-width="2"/>
  <text x="600" y="108" text-anchor="middle" class="label">利用者・アプリケーション</text>
  <path d="M600 130 L600 165" class="line"/>

  <rect x="100" y="170" width="1000" height="155" rx="20" fill="#e6f6ff" stroke="#127fbf" stroke-width="3"/>
  <text x="130" y="207" class="layer">Cloud Services</text>
  <text x="130" y="238" class="body">要求を調整するSnowflake管理のサービス群</text>
  <rect x="130" y="260" width="190" height="42" rx="10" fill="#ffffff" stroke="#5ca6cf"/>
  <rect x="345" y="260" width="190" height="42" rx="10" fill="#ffffff" stroke="#5ca6cf"/>
  <rect x="560" y="260" width="210" height="42" rx="10" fill="#ffffff" stroke="#5ca6cf"/>
  <rect x="795" y="260" width="255" height="42" rx="10" fill="#ffffff" stroke="#5ca6cf"/>
  <text x="225" y="287" text-anchor="middle" class="body">認証・アクセス制御</text>
  <text x="440" y="287" text-anchor="middle" class="body">メタデータ管理</text>
  <text x="665" y="287" text-anchor="middle" class="body">解析・最適化</text>
  <text x="922" y="287" text-anchor="middle" class="body">インフラ調整・compliance</text>

  <path d="M600 325 L600 365" class="line"/>
  <rect x="100" y="370" width="1000" height="150" rx="20" fill="#fff4e5" stroke="#c77800" stroke-width="3"/>
  <text x="130" y="407" class="layer">Compute — Virtual Warehouse</text>
  <text x="130" y="438" class="body">SQLやSnowparkの処理を実行する、互いに独立したMPP compute cluster</text>
  <rect x="155" y="460" width="250" height="42" rx="10" fill="#ffffff" stroke="#d69e2e"/>
  <rect x="475" y="460" width="250" height="42" rx="10" fill="#ffffff" stroke="#d69e2e"/>
  <rect x="795" y="460" width="250" height="42" rx="10" fill="#ffffff" stroke="#d69e2e"/>
  <text x="280" y="487" text-anchor="middle" class="label">ETL Warehouse</text>
  <text x="600" y="487" text-anchor="middle" class="label">BI Warehouse</text>
  <text x="920" y="487" text-anchor="middle" class="label">Ad-hoc Warehouse</text>

  <path d="M280 502 L380 566" class="line data-line"/>
  <path d="M600 502 L600 566" class="line data-line"/>
  <path d="M920 502 L820 566" class="line data-line"/>
  <rect x="100" y="570" width="1000" height="112" rx="20" fill="#e9f8ef" stroke="#27864a" stroke-width="3"/>
  <text x="130" y="607" class="layer">Database Storage</text>
  <text x="130" y="640" class="body">永続データを中央で保持。Snowflake tableでは最適化・圧縮されたcolumnar形式をSnowflakeが管理</text>
  <text x="130" y="666" class="note">複数warehouseが同じ永続データへアクセスするため、データをwarehouseごとに複製する必要はない</text>
</svg>
