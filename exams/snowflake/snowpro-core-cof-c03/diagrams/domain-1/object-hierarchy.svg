<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">Snowflake object hierarchy</title>
  <desc id="desc">Organization contains accounts. An account contains account objects and databases. A database contains schemas, and a schema contains schema objects.</desc>
  <style>.box{fill:#f7fbff;stroke:#2563eb;stroke-width:2;rx:12}.scope{fill:#eef2ff;stroke:#4f46e5;stroke-width:2;rx:16}.t{font:600 18px sans-serif;fill:#172554}.s{font:14px sans-serif;fill:#334155}.a{stroke:#475569;stroke-width:2;marker-end:url(#m)}</style>
  <defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs>
  <rect class="scope" x="35" y="25" width="830" height="500"/>
  <text class="t" x="65" y="60">Organization</text><text class="s" x="210" y="60">business entity 全体。複数 account を包含</text>
  <rect class="scope" x="90" y="90" width="720" height="395"/>
  <text class="t" x="120" y="125">Account</text><text class="s" x="210" y="125">security・billing・object管理の境界</text>
  <rect class="box" x="130" y="160" width="250" height="90"/>
  <text class="t" x="155" y="194">Account objects</text><text class="s" x="155" y="220">warehouse / user / role / share</text>
  <rect class="scope" x="420" y="150" width="340" height="290"/>
  <text class="t" x="450" y="185">Database</text>
  <rect class="scope" x="465" y="210" width="250" height="190"/>
  <text class="t" x="495" y="245">Schema</text>
  <rect class="box" x="500" y="275" width="180" height="90"/>
  <text class="t" x="525" y="309">Schema objects</text><text class="s" x="525" y="335">table / view / stage …</text>
  <path class="a" d="M380 205 H415"/><path class="a" d="M590 190 V205"/><path class="a" d="M590 250 V270"/>
  <text class="s" x="130" y="460">同じ account 内でも database / schema を完全修飾名 DB.SCHEMA.OBJECT で指定する</text>
</svg>
